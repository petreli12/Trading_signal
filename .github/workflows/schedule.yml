name: signal-bot schedule

on:
  # GitHub's built-in `schedule:` cron is best-effort and was firing hours late
  # (top-of-hour congestion), so the pre-open brief missed the open. Scheduling
  # is now driven by an external scheduler (cron-job.org) that calls this
  # workflow via the workflow_dispatch REST API at the exact ET times:
  #   - pre-open:   08:00 America/New_York, Mon–Fri  (inputs.mode=preopen)
  #   - post-close: 20:00 America/New_York, Mon–Fri  (inputs.mode=postclose)
  # The NYSE trading-day gate in main.py still no-ops on holidays.
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "postclose"
        type: choice
        options:
          - preopen
          - postclose
      force:
        description: "Run even if today is not an NYSE trading day (testing)"
        required: false
        default: false
        type: boolean

# The bot's SQLite DB is committed back to the repo after each run (see the
# "Persist database" step), so it needs write access to contents.
permissions:
  contents: write

# Serialize runs so two overlapping runs (e.g. a manual double-trigger) never
# race to push the database. Don't cancel an in-flight brief.
concurrency:
  group: signal-bot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the post-run rebase/push of the DB is reliable.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: signal-bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          # Triggered only via workflow_dispatch (external scheduler / manual).
          MODE="${{ github.event.inputs.mode }}"
          echo "mode=${MODE:-postclose}" >> "$GITHUB_OUTPUT"

      - name: Run bot
        working-directory: signal-bot
        env:
          X_PROVIDER_API_KEY: ${{ secrets.X_PROVIDER_API_KEY }}
          X_LIST_ID: ${{ secrets.X_LIST_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Optional failure-alert overrides (fall back to defaults / EMAIL_TO).
          ALERT_ON_FAILURE: ${{ secrets.ALERT_ON_FAILURE }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          # SMS digest is disabled: Metro/T-Mobile blocks carrier email-to-SMS
          # gateways, so texts never reach the handset. Email is the only channel.
          # To re-enable, wire a real SMS provider (e.g. Twilio) in deliver/email_send.py
          # and restore SMS_* env here.
        run: |
          ARGS="--mode ${{ steps.mode.outputs.mode }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      # Persist the SQLite DB across runs so the bot has memory between runs:
      # the incremental-fetch watermark (latest post id) and the day-over-day
      # mention/sentiment history that the Δ column is computed from. Without
      # this, every run starts empty and Δ always equals the raw count.
      - name: Persist database
        if: always()
        run: |
          DB="signal-bot/signal_bot.db"
          if [ -z "$(git status --porcelain -- "$DB")" ]; then
            echo "No DB changes to persist."
            exit 0
          fi
          git add "$DB"
          git -c user.name="signal-bot" \
              -c user.email="signal-bot@users.noreply.github.com" \
              commit -m "chore(data): update signal_bot.db [skip ci]"
          # Integrate anything that landed on the branch during the run, then push.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
